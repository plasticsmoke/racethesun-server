# Nginx config for Race the Sun replacement server
# Handles both game hostnames on port 80 (game uses plain HTTP)
#
# The server_name values below are the hostnames hardcoded in the game client.
# Do NOT change them — players point these hostnames to your server IP via
# their hosts file or DNS overrides.
#
# If this VPS runs other sites, remove the default_server block below and
# make sure your other nginx configs don't conflict on port 80.
#
# Install:
#   sudo cp nginx-racethesun.conf /etc/nginx/sites-available/racethesun
#   sudo ln -s /etc/nginx/sites-available/racethesun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limit: 5 requests/sec per IP with small burst (game makes ~2 requests on launch)
limit_req_zone $binary_remote_addr zone=racethesun:1m rate=5r/s;

# Drop requests that don't match our server_name (scanners hitting by IP)
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name tech.flippfly.com monkeytech.flippfly.com;

    access_log /var/log/nginx/racethesun.access.log;
    error_log  /var/log/nginx/racethesun.error.log;

    # Max body size — game sends at most a few bytes
    client_max_body_size 4k;

    # Only allow the two paths the game uses
    location = /LatestNews/News.php {
        limit_req zone=racethesun burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /parse/functions/get_current_server_info {
        limit_req zone=racethesun burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else — reject
    location / {
        return 444;
    }
}
